name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore approved launcher artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode launcher-icon.png.b64 > app/src/main/res/drawable-nodpi/masterpiece_icon.png

      - name: Build release bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Restore encrypted upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

      - name: Sign and verify release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab Masterpiece-Wallpapers-AI1-v1.5-signed.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            Masterpiece-Wallpapers-AI1-v1.5-signed.aab masterpiece-upload
          jarsigner -verify -verbose -certs Masterpiece-Wallpapers-AI1-v1.5-signed.aab

      - name: Upload signed app bundle
        uses: actions/upload-artifact@v4
        with:
          name: masterpiece-ai1-release-signed-aab
          path: Masterpiece-Wallpapers-AI1-v1.5-signed.aab
          if-no-files-found: error
